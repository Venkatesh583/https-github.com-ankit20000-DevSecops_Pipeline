<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0066cc" />
    <meta name="description" content="HealthCare Pro - Modern Healthcare Management Platform" />
    <meta name="keywords" content="healthcare, appointments, medical, doctors, reports" />
    <meta name="author" content="HealthCare Pro" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet" />
    <title>HealthCare Pro | Modern Healthcare Platform</title>
    <style>
      body { margin: 0; padding: 0; background: #f0f4f8; }
      #root { min-height: 100vh; }
      /* Preloader */
      .app-preloader {
        position: fixed; inset: 0; background: linear-gradient(135deg, #0066cc 0%, #00cc99 100%);
        display: flex; align-items: center; justify-content: center; z-index: 9999;
        transition: opacity 0.5s ease;
      }
      .app-preloader svg { animation: pulse 1.5s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { transform: scale(1); opacity:1; } 50% { transform: scale(1.15); opacity:.8; } }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
